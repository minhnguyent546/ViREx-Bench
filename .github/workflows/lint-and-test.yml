name: Lint and Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  check-imports:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Clone the repository
        uses: actions/checkout@v7
      - name: Install the latest version of uv and set the python version
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: ">=0.9.21"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Check imports
        run: |
          export PYTHONPATH="${{ github.workspace }}"
          uv run --frozen python .github/workflows/check_imports.py --src_path virex_bench

  lint-with-ruff:
      runs-on: ubuntu-latest
      steps:
        - name: Clone the repository
          uses: actions/checkout@v7

        - name: Install the latest version of uv and set the python version
          uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
          with:
            version: ">=0.9.21"
            enable-cache: true

        - name: Lint with ruff
          run: |
            uv run --frozen ruff check --output-format=github virex_bench tests scripts

        - name: Check formatting with ruff
          run: |
            uv run --frozen ruff format --check --output-format=github virex_bench tests scripts

  test-with-pytest:
      runs-on: ubuntu-latest
      strategy:
        matrix:
          python-version: ["3.12"]
      steps:
        - name: Clone the repository
          uses: actions/checkout@v7

        - name: Install the latest version of uv and set the python version
          uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
          with:
            version: ">=0.9.21"
            python-version: ${{ matrix.python-version }}
            enable-cache: true

        - name: Run tests with pytest
          run: |
            uv run --frozen pytest tests -v
